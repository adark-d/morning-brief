[project]
name = "morning-brief"
version = "0.1.0"
description = "Personal AI news briefing with practical concept explanations."
readme = "README.md"
authors = [
    { name = "David Adarkwah", email = "72516754+adark-d@users.noreply.github.com" },
]
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.2",
    "boto3>=1.43.98",
    "genai-prices>=0.1.7,<0.2", # Pydantic AI 1.x cannot read the 0.1 usage fields.
    "httpx>=0.28.1",
    "jinja2>=3.1",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[anthropic]>=2.46.0,<3",
    "pydantic-settings>=2.14.2",
    "structlog>=26.1.0",
]

[project.scripts]
brief = "scripts.run_ai_brief:main"

[build-system]
requires = ["hatchling>=1.32.3,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_brief", "src/brief_core", "scripts"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "scripts", "pyproject.toml", "README.md"]

[dependency-groups]
dev = [
    "boto3-stubs[ssm,cloudwatch]>=1.43.98",
    "mypy>=2.3.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "N", "ANN", "ARG", "PTH", "RET", "TID"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "scripts", "tests"]
extraPaths = ["."]
venvPath = "."
venv = ".venv"

# Test doubles can expose unknown types from third-party libraries.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
