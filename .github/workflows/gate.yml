name: Gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: ruff (lint)
        run: uv run --locked ruff check src scripts tests
      - name: ruff (format)
        run: uv run --locked ruff format --check src scripts tests
      - name: mypy
        run: uv run --locked mypy src scripts tests
      - name: pyright
        run: uv run --locked pyright
      - name: pytest
        run: uv run --locked pytest
      - name: Check package and local command
        run: |
          uv build
          uv run --locked brief --help
      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project -o /tmp/brief-runtime.txt > /dev/null
          uvx --from pip-audit==2.10.1 pip-audit -r /tmp/brief-runtime.txt --no-deps --disable-pip

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: Validate infrastructure
        run: |
          for directory in infra infra/terraform_state; do
            terraform -chdir="$directory" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$directory" validate
          done
