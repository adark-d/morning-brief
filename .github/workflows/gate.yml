name: Gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: ruff (lint)
        run: uv run --locked ruff check src scripts tests
      - name: ruff (format)
        run: uv run --locked ruff format --check src scripts tests
      - name: mypy
        run: uv run --locked mypy src scripts tests
      - name: pyright
        run: uv run --locked pyright
      - name: pytest
        run: uv run --locked pytest
      - name: Check package and local command
        run: |
          uv build
          uv run --locked brief --help
      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project -o /tmp/brief-runtime.txt > /dev/null
          uvx --from pip-audit==2.10.1 pip-audit -r /tmp/brief-runtime.txt --no-deps --disable-pip

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: Validate infrastructure
        run: |
          for directory in infra infra/terraform_state; do
            terraform -chdir="$directory" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$directory" validate
          done
