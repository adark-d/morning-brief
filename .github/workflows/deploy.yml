name: Deploy (batch Lambda)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/gate.yml"

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/gate.yml

  deploy:
    needs: gate
    environment: production
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check deployment settings
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          LAMBDA_FUNCTION: ${{ vars.LAMBDA_FUNCTION }}
        run: |
          for variable in AWS_REGION AWS_DEPLOY_ROLE_ARN ECR_REPOSITORY LAMBDA_FUNCTION; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing GitHub variable: $variable"
              exit 1
            fi
          done

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Check for an existing image for this commit
        id: image
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          repository_name="${ECR_REPOSITORY#*/}"
          if output=$(aws ecr describe-images \
               --repository-name "$repository_name" \
               --image-ids imageTag="$GITHUB_SHA" 2>&1); then
            echo "Image $GITHUB_SHA already in ECR; the build will be skipped."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif echo "$output" | grep -q "ImageNotFoundException"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$output"
            exit 1
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.image.outputs.exists == 'false'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.image.outputs.exists == 'false'

      - name: Build and push image
        if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          provenance: false # Required for Lambda container images.
          push: true
          tags: ${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Roll the Lambda to the new image
        env:
          FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION }}
          IMAGE_URI: ${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --image-uri "$IMAGE_URI"

      - name: Verify the rollout
        env:
          FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION }}
        run: |
          if ! aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"; then
            aws lambda get-function --function-name "$FUNCTION_NAME" \
              --query 'Configuration.[LastUpdateStatus,LastUpdateStatusReasonCode,LastUpdateStatusReason]' \
              --output text
            echo "::error::Lambda rollout did not reach LastUpdateStatus=Successful"
            exit 1
          fi
          aws lambda get-function --function-name "$FUNCTION_NAME" \
            --query 'Configuration.[State,LastUpdateStatus]' --output text
